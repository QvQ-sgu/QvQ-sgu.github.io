name: Mirror LEAFALL site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch published site
        run: |
          set -e
          curl -fsSL https://starline-arcade.surge.sh/index.html -o index.html
          mkdir -p assets
          for f in hero-wallpaper.jpg hero-wallpaper-sm.jpg player-girl.png; do
            curl -fsSL "https://starline-arcade.surge.sh/assets/$f" -o "assets/$f"
            ls -l "assets/$f"
          done
          ls -l index.html
          grep -c LEAFALL index.html || true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "site: sync index.html + assets"
          git push
