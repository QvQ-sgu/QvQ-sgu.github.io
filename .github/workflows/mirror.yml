name: Mirror LEAFALL site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror published site
        run: |
          set -e
          rm -rf _mirror
          mkdir -p _mirror
          wget -q -r -np -nH --cut-dirs=1 -e robots=off \
            --reject 'robots.txt,*://*?*' \
            -P _mirror https://starline-arcade.surge.sh/
          find _mirror -type f -printf '%P\t%s\n' | sort
          test -s _mirror/index.html

      - name: Sync into repo
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='_mirror' --exclude='.sync-stamp' _mirror/ ./
          rm -rf _mirror
          ls -l index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "site: sync published site"
          git push
