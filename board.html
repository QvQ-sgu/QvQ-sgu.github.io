<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>排行榜 · LEAFALL 落叶秋游</title>
<meta name="description" content="LEAFALL 落叶秋游本机排行榜与统计，成绩只存在你自己的浏览器里。" />
<meta name="theme-color" content="#fdf4df" />
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Archivo:wght@500;700;900&amp;display=swap">
<link rel="icon" type="image/png" href="assets/leafall-icon.png" />
<link rel="stylesheet" href="assets/site.css" />
</head>
<body class="has-tabbar page-board">
<div class="bg-layer"></div>
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark"><img src="assets/leafall-icon.png" alt="LEAFALL 标志" /></span>
    <span class="brand-text">
      <b id="brandName">LEAFALL</b>
      <i id="brandCn">落叶秋游</i>
    </span>
  </a>
  <nav class="nav">
    <a href="index.html">开始游戏</a>
    <a href="howto.html">玩法</a>
    <a href="board.html">排行榜</a>
    <a href="admin.html">配置后台</a>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="soundBtn" aria-label="音效开关" title="音效开关">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 9v6h3l5 4V5l-5 4H4z" />
        <path id="soundWave" d="M16 9c1.5 1.5 1.5 4.5 0 6M19 6c3 3 3 9 0 12" />
      </svg>
    </button>
  </div>
</header>

  
<main>
<section id="board">
    <div class="section-head">
      <h2>排行榜</h2>
      <span>成绩只存在你自己浏览器里</span>
      <div class="line"></div>
    </div>
    <div class="board-wrap">
      <div class="board">
        <table>
          <thead>
            <tr>
              <th class="rank">#</th>
              <th>玩家</th>
              <th class="num">分数</th>
              <th class="num">关卡</th>
              <th class="num">用时</th>
              <th>难度</th>
            </tr>
          </thead>
          <tbody id="boardBody">
            <tr class="empty-row"><td colspan="6">还没人上榜，打完一局来留个名。</td></tr>
          </tbody>
        </table>
      </div>
      <div class="board-aside">
        <h3>你的记录</h3>
        <p>不联网也不上传，都存在你这台设备上。换台电脑就得从头来。</p>
        <div class="stat-line"><span>最高分</span><b id="statBest">0</b></div>
        <div class="stat-line"><span>最远关卡</span><b id="statLevel">—</b></div>
        <div class="stat-line"><span>总局数</span><b id="statRuns">0</b></div>
        <div class="stat-line"><span>总击落</span><b id="statKills">0</b></div>
        <button class="btn small" id="clearBoard" style="margin-top:14px;width:100%;justify-content:center">清空本机记录</button>
      </div>
    </div>
  </section>

  
</main>
<footer>
    <span id="footerText">LEAFALL · 纯前端街机 · 无后端依赖</span>
    <span>不用登录 · 没有广告 · 打开就玩</span>
  </footer>

<script src="assets/safe-dom.js"></script>
<script src="assets/core.js"></script>
<script src="assets/ui.js"></script>

</body>
</html>
